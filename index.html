<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Passaporte de Segurança — carteirinha digital de treinamentos legais. Consulte por RE ou QR Code a validade das habilitações de cada colaborador.">
<meta name="theme-color" content="#1f36c7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f36c7'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='20' font-weight='900' fill='white' text-anchor='middle'%3EU%3C/text%3E%3C/svg%3E">
<title>Passaporte de Segurança — Unilever</title>
<style>
  :root{
    --uni:#1f36c7; --uni-d:#16269a; --uni-2:#2555d8; --uni-l:#eef1ff;
    --ink:#0e1424; --mut:#5b6478; --mut2:#8a93a6; --line:#e6e9f2; --line2:#eef1f6; --bg:#f5f7fb; --card:#fff;
    --ok:#0f9d58; --ok-bg:#e7f6ee; --warn:#e08600; --warn-bg:#fdf3e3; --bad:#d5352b; --bad-bg:#fdeceb;
    --r:14px; --sh:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.05);
    --sh-md:0 8px 26px -8px rgba(16,24,40,.16); --sh-lg:0 30px 70px -20px rgba(16,24,40,.35);
    --sb:248px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:14px}
  a{color:inherit;text-decoration:none}
  .ic-svg{display:block}
  .hidden{display:none!important}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#d6dbe6;border-radius:9px}

  /* ---------- brand ---------- */
  .brand-mark{position:relative;display:inline-grid;place-items:center;background:#fff;border-radius:26%;box-shadow:0 2px 6px rgba(16,24,40,.12);flex:none}
  .brand-mark img{position:absolute;inset:12%;width:76%;height:76%;object-fit:contain}
  .brand-mark .fb{width:66%;height:66%;color:var(--uni)}
  .wordmark{font-weight:800;letter-spacing:-.3px}

  /* ================= LOGIN ================= */
  .login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
  .login .hero{position:relative;overflow:hidden;color:#fff;padding:52px 56px;display:flex;flex-direction:column;justify-content:space-between;
    background:linear-gradient(150deg,#2555d8,#1f36c7 55%,#141f8f)}
  .login .hero::before{content:"";position:absolute;inset:0;opacity:.5;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.16) 1px,transparent 0);background-size:16px 16px}
  .login .hero::after{content:"";position:absolute;bottom:-30%;right:-20%;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 65%)}
  .hero-top{position:relative;z-index:1;display:flex;align-items:center;gap:14px}
  .hero-top .brand-mark{width:56px;height:56px}
  .hero-top b{font-size:20px;font-weight:800;letter-spacing:.3px}
  .hero-top span{display:block;font-size:12px;opacity:.8;font-weight:500}
  .hero-mid{position:relative;z-index:1}
  .hero-mid h1{font-size:40px;line-height:1.1;letter-spacing:-1px;font-weight:800;max-width:15ch}
  .hero-mid p{font-size:16px;opacity:.86;margin-top:18px;max-width:46ch;line-height:1.6}
  .hero-feats{position:relative;z-index:1;display:flex;flex-direction:column;gap:14px;margin-top:26px}
  .hero-feats div{display:flex;align-items:center;gap:12px;font-size:14px;opacity:.95}
  .hero-feats .fi{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
  .hero-foot{position:relative;z-index:1;font-size:12px;opacity:.7}

  .login .panel{display:flex;align-items:center;justify-content:center;padding:40px;background:var(--card)}
  .login-box{width:100%;max-width:380px}
  .login-box h2{font-size:24px;letter-spacing:-.5px}
  .login-box .sub{color:var(--mut);font-size:14px;margin:6px 0 26px}
  .btn-sso{width:100%;height:52px;border:1.5px solid var(--line);border-radius:13px;display:flex;align-items:center;justify-content:center;gap:11px;font-weight:700;font-size:15px;background:#fff;transition:.15s}
  .btn-sso:hover{border-color:var(--uni);background:var(--uni-l)}
  .btn-sso .brand-mark{width:26px;height:26px;box-shadow:none}
  .orsep{display:flex;align-items:center;gap:12px;color:var(--mut2);font-size:12px;font-weight:600;margin:20px 0}
  .orsep::before,.orsep::after{content:"";flex:1;height:1px;background:var(--line)}
  .fld{margin-bottom:14px}
  .fld label{font-size:12.5px;font-weight:700;display:block;margin-bottom:6px}
  .fld input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:15px;outline:none;transition:.15s}
  .fld input:focus{border-color:var(--uni);box-shadow:0 0 0 4px var(--uni-l)}
  .btn-primary{width:100%;height:50px;background:var(--uni);color:#fff;border-radius:12px;font-weight:700;font-size:15px;box-shadow:0 10px 22px -8px rgba(31,54,199,.6);transition:.15s}
  .btn-primary:hover{background:var(--uni-d)}
  .btn-primary:active{transform:translateY(1px)}
  .login-alt{text-align:center;margin-top:22px;font-size:13.5px;color:var(--mut)}
  .login-alt a{color:var(--uni);font-weight:700}

  /* ================= APP SHELL ================= */
  .app{display:flex;min-height:100vh}
  .sidebar{width:var(--sb);flex:none;background:#fff;border-right:1px solid var(--line);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:60;transition:transform .25s}
  .sb-brand{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid var(--line2)}
  .sb-brand .brand-mark{width:38px;height:38px}
  .sb-brand b{font-size:15px;font-weight:800;line-height:1.05}
  .sb-brand small{font-size:10.5px;color:var(--mut);font-weight:600}
  .sb-nav{flex:1;overflow-y:auto;padding:12px 12px}
  .sb-grp{font-size:10.5px;font-weight:800;color:var(--mut2);text-transform:uppercase;letter-spacing:.6px;padding:12px 10px 7px}
  .nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;font-size:14px;font-weight:600;color:var(--mut);margin-bottom:2px;transition:.12s;width:100%}
  .nav .ni{width:20px;height:20px;flex:none;color:var(--mut2)}
  .nav:hover{background:var(--bg);color:var(--ink)}
  .nav.on{background:var(--uni);color:#fff;box-shadow:0 8px 18px -8px rgba(31,54,199,.7)}
  .nav.on .ni{color:#fff}
  .nav .cnt{margin-left:auto;font-size:11px;font-weight:800;background:var(--bad);color:#fff;padding:1px 7px;border-radius:999px}
  .nav.on .cnt{background:rgba(255,255,255,.25)}
  .sb-user{border-top:1px solid var(--line2);padding:12px;display:flex;align-items:center;gap:11px}
  .sb-user .av{width:38px;height:38px;border-radius:50%;background:var(--uni-l);color:var(--uni);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
  .sb-user b{font-size:13px;font-weight:700}.sb-user small{font-size:11px;color:var(--mut);display:block}
  .sb-user .out{margin-left:auto;color:var(--mut2);padding:6px}
  .sb-user .out:hover{color:var(--bad)}

  .main{flex:1;margin-left:var(--sb);min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:40;height:62px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px}
  .hamb{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);place-items:center}
  .tb-title{font-size:17px;font-weight:800;letter-spacing:-.3px}
  .tb-search{margin-left:8px;flex:1;max-width:400px;display:flex;align-items:center;gap:9px;height:40px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:0 13px}
  .tb-search input{border:none;background:none;outline:none;flex:1}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .tb-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;background:#fff;position:relative;color:var(--mut)}
  .tb-btn:hover{color:var(--uni);border-color:var(--uni)}
  .tb-btn .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
  .content{padding:26px 28px 60px;max-width:1220px;width:100%}

  /* ---------- ui kit ---------- */
  .ph{display:flex;align-items:flex-end;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  .ph h1{font-size:23px;letter-spacing:-.5px}
  .ph p{color:var(--mut);font-size:13.5px;margin-top:3px}
  .ph .sp{margin-left:auto;display:flex;gap:10px}
  .btn{padding:10px 15px;border-radius:11px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);display:inline-flex;align-items:center;gap:8px;transition:.14s;white-space:nowrap}
  .btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}
  .btn.pri{background:var(--uni);color:#fff;border-color:var(--uni);box-shadow:0 8px 18px -8px rgba(31,54,199,.7)}
  .btn.pri:hover{background:var(--uni-d)}
  .btn.sm{padding:7px 11px;font-size:12.5px}
  .btn .ic-svg{width:16px;height:16px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);position:relative;overflow:hidden}
  .kpi .kic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;margin-bottom:13px}
  .kpi .kic .ic-svg{width:21px;height:21px}
  .kpi h3{font-size:29px;letter-spacing:-1px}
  .kpi small{color:var(--mut);font-size:13px;font-weight:600}
  .kpi .trend{position:absolute;top:16px;right:16px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}

  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:22px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
  .panel .pt{padding:16px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
  .panel .pt b{font-size:15px}.panel .pt small{color:var(--mut);font-size:12px}
  .panel .pt .more{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--uni)}
  .panel .pb{padding:16px 18px}

  .bar{display:flex;align-items:center;gap:12px;margin-bottom:13px}
  .bar .lb{width:130px;font-size:12.5px;font-weight:600;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .track{flex:1;height:22px;background:var(--bg);border-radius:7px;overflow:hidden}
  .bar .fill{height:100%;border-radius:7px}
  .bar .vv{font-size:12px;font-weight:800;width:44px;text-align:right;flex:none}

  .lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
  .lrow:last-child{border:none}
  .lrow .av{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
  .lrow b{font-size:13px;display:block}.lrow small{font-size:11.5px;color:var(--mut)}

  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:0 13px;height:42px}
  .search input{border:none;outline:none;flex:1;background:none}
  .fsel{height:42px;border:1px solid var(--line);border-radius:11px;padding:0 12px;font-weight:600;color:var(--ink);background:#fff}
  .tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
  .tbl-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;background:#fff;min-width:640px}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:800;padding:13px 16px;border-bottom:1px solid var(--line);background:#fbfcfe;white-space:nowrap}
  tbody td{padding:12px 16px;border-bottom:1px solid var(--line2);font-size:13.5px}
  tbody tr{cursor:pointer;transition:.1s}
  tbody tr:hover{background:var(--uni-l)}
  tbody tr:last-child td{border-bottom:none}
  .cell-nm{display:flex;align-items:center;gap:11px}
  .cell-nm .av{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
  .cell-nm b{font-size:13.5px;font-weight:700}.cell-nm small{font-size:11.5px;color:var(--mut)}
  .tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--bg);color:var(--mut);white-space:nowrap}
  .st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800}
  .st .d{width:8px;height:8px;border-radius:50%}
  .st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.bad{color:var(--bad)}
  .st.ok .d{background:var(--ok)}.st.warn .d{background:var(--warn)}.st.bad .d{background:var(--bad)}
  .tfoot{padding:12px 16px;color:var(--mut);font-size:12.5px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}

  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
  .tcard .th{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .tcard .tic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
  .tcard .tic .ic-svg{width:22px;height:22px}
  .tcard b{font-size:14px;line-height:1.2}
  .tcard .row{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-top:1px solid var(--line2)}
  .tcard .row span{color:var(--mut)}

  .srcgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .src{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);display:flex;gap:14px;align-items:flex-start}
  .src .si{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
  .src .si .ic-svg{width:23px;height:23px}
  .src b{font-size:14.5px}.src p{color:var(--mut);font-size:12.5px;margin:3px 0 10px;line-height:1.5}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--ok)}
  .live .d{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* ---------- carteirinha (premium) ---------- */
  .cart-shell{max-width:380px;width:100%}
  .cbtns{display:flex;gap:8px;margin-bottom:14px}
  .cbtn{flex:1;padding:11px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:800;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;transition:.14s}
  .cbtn small{font-weight:500;font-size:10px}
  .cbtn.on{background:var(--uni);color:#fff;border-color:var(--uni);box-shadow:0 10px 20px -8px rgba(31,54,199,.6)}
  .cbtn.on small{color:rgba(255,255,255,.85)}
  .cbtn.lib.on{background:#0b7d4e;border-color:#0b7d4e;box-shadow:0 10px 20px -8px rgba(11,125,78,.6)}

  .badge-card{background:#fff;border-radius:22px;overflow:hidden;border:1px solid rgba(16,24,40,.06);box-shadow:0 1px 2px rgba(16,24,40,.06),0 24px 50px -16px rgba(16,24,40,.32)}
  .cart-head{position:relative;color:#fff;padding:16px;display:flex;align-items:center;gap:12px;overflow:hidden;background:linear-gradient(120deg,#2555d8,#1f36c7 55%,#182aa6)}
  .cart-head.lib{background:linear-gradient(120deg,#0e8f5c,#0b7d4e 55%,#075f3b)}
  .cart-head::before{content:"";position:absolute;inset:0;opacity:.5;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.18) 1px,transparent 0);background-size:9px 9px;-webkit-mask:linear-gradient(90deg,transparent,#000 60%)}
  .cart-head::after{content:"";position:absolute;top:-60%;right:-10%;width:180px;height:220px;transform:rotate(20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent)}
  .cart-head .brand-mark{width:40px;height:40px;position:relative;z-index:1}
  .cart-head .ht{position:relative;z-index:1;flex:1}
  .cart-head b{font-size:16px;font-weight:800;letter-spacing:1px;line-height:1}
  .cart-head small{font-size:10.5px;opacity:.82;display:block;margin-top:3px;font-weight:500}
  .cart-head .chipw{position:relative;z-index:1;font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);padding:5px 9px;border-radius:999px}
  .secband{height:5px;background:linear-gradient(90deg,#f5c04e,#ec6f9c,#7a8cf0,#4fd0c0,#f5c04e);background-size:200% 100%;animation:holo 6s linear infinite}
  @keyframes holo{to{background-position:200% 0}}
  .portaria{background:#f2f5fc;color:#3a4a86;font-size:10px;font-weight:600;text-align:center;padding:7px;border-bottom:1px solid var(--line);letter-spacing:.2px}
  .front{display:flex;gap:13px;padding:16px 16px 14px}
  .foto{width:76px;height:96px;border-radius:12px;flex:none;position:relative;overflow:hidden;background:linear-gradient(160deg,#eef1ff,#dfe5fb);border:1px solid rgba(31,54,199,.15);display:grid;place-items:center}
  .foto .fi{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--uni),#4460e6);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;box-shadow:0 4px 10px rgba(31,54,199,.3)}
  .foto .flabel{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:8px;letter-spacing:1px;font-weight:700;color:#8a94b5;background:rgba(255,255,255,.6);padding:2px}
  .fdata{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
  .fname{font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
  .fsub{font-size:11.5px;color:var(--mut);font-weight:600}
  .fmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .fmeta span{font-size:10px;font-weight:700;background:var(--bg);color:#48506a;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
  .idrow{display:flex;gap:8px;padding:0 16px 14px}
  .idcell{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
  .idcell small{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:800;display:block}
  .idcell b{font-size:13px;font-weight:700;margin-top:2px;display:block}
  .idcell b.ok{color:var(--ok)}.idcell b.warn{color:var(--warn)}.idcell b.bad{color:var(--bad)}
  .status-strip{display:flex;align-items:center;gap:9px;padding:12px 16px;font-weight:800;font-size:13.5px}
  .status-strip.ok{background:var(--ok-bg);color:var(--ok)}
  .status-strip.warn{background:var(--warn-bg);color:var(--warn)}
  .status-strip.bad{background:var(--bad-bg);color:var(--bad)}
  .status-strip .dot{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px rgba(255,255,255,.5)}
  .tr-sec{font-size:10.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .exec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 16px 14px}
  .gtile{border:1px solid var(--line);border-radius:13px;padding:10px;background:#fff;position:relative;overflow:hidden}
  .gtile .gt{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .gtile .gi{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
  .gtile .gi .ic-svg{width:18px;height:18px}
  .gtile .gn{font-size:11px;font-weight:700;line-height:1.12}
  .gtile .gd{display:flex;justify-content:space-between;align-items:center}
  .gtile .dt{font-weight:800;font-size:12px}

function color(seed){let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length];}

function findTr(e,kw,req,exc){return e.trainings.find(t=>{const n=t.nome.toLowerCase();if(exc&&exc.some(x=>n.includes(x)))return false;if(req&&!req.some(x=>n.includes(x)))return false;return kw.some(k=>n.includes(k));});}

function iconKey(n){n=(n||'').toLowerCase();
  if(n.includes('altura'))return 'altura';
  if(n.includes('confinado')||n.includes('nr33'))return 'confinado';
  if(n.includes('empilhad'))return 'forklift';
  if(n.includes('paleteira'))return 'pallet';
  if(n.includes('talha'))return 'hoist';
  if(n.includes('plataforma')||n.includes('pta'))return 'lift';
  if(n.includes('munck')||n.includes('guindaste')||n.includes('iça')||n.includes('icam'))return 'crane';
  if(n.includes('andaime')||n.includes('nr18'))return 'scaffold';
  if(n.includes('rebocador')||n.includes('direç'))return 'wheel';
  if(n.includes('nr12')||n.includes('máq')||n.includes('maq')||n.includes('caldeira')||n.includes('nr 13')||n.includes('vasos')||n.includes('centerline')||n.includes('dfos'))return 'gear';
  if(n.includes('nr10')||n.includes('sep')||n.includes('eletric'))return 'bolt';
  if(n.includes('quente')||n.includes('inflam')||n.includes('nr20'))return 'flame';
  if(n.includes('escava'))return 'shovel';
  if(n.includes('line break'))return 'valve';
  if(n.includes('dust')||n.includes('combust')||n.includes('explos'))return 'burst';
  if(n.includes('psm'))return 'shield';
  return 'cert';
}

/* ---------- QR (decorative) ---------- */
function qr(el,seed){if(!el)return;const N=21;let h=0;for(const c of seed)h=(h*33+c.charCodeAt(0))>>>0;
  function rnd(){h=(h*1103515245+12345)&0x7fffffff;return h/0x7fffffff;}
  const finder=(x,y)=>(x<7&&y<7)||(x>N-8&&y<7)||(x<7&&y>N-8);let cells='';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){let on;
    if(finder(x,y)){const px=x<7?x:x-(N-7),py=y<7?y:y-(N-7);on=(px===0||px===6||py===0||py===6)||(px>=2&&px<=4&&py>=2&&py<=4);}
    else on=rnd()>0.55;
    if(on)cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}
  el.innerHTML=`<svg viewBox="0 0 ${N} ${N}" width="100%" height="100%" shape-rendering="crispEdges" fill="#0e1424">${cells}</svg>`;}
function drawQRs(){document.querySelectorAll('.qrauto').forEach(el=>qr(el,el.dataset.seed));}

function execCard(e){
  const st=empStatus(e);
  const stMap={ok:['ok','✓ Apto para as atividades'],warn:['warn','⚠ Atenção: treinamento vencendo'],bad:['bad','✕ Inapto: habilitação vencida']};
  const [sc,sl]=stMap[st];
  const aso=asoDate(e),asoS=daysTo(aso)<0?'bad':(daysTo(aso)<=30?'warn':'ok');
  const ig=integ(e),igS=daysTo(ig)<0?'bad':(daysTo(ig)<=30?'warn':'ok');
  const tint=c=>`background:${c}14;color:${c}`;
  const used=new Set();
  const filled=(name,label,t)=>{const s=trStatus(t),d=daysTo(t.vencimento),c=catColor(name);
    return `<div class="gtile ${s}"><div class="gt"><div class="gi" style="${tint(c)}">${icoFor(name,18)}</div><div class="gn">${esc(label)}</div></div>
      <div class="gd"><span class="dt" style="color:var(--${s})">${fmt(t.vencimento)}</span><span class="mini-pill ${s}">${s==='bad'?'vencido':s==='warn'?d+'d':'válido'}</span></div></div>`;};
  const tiles=EXEC_CAT.map(c=>{const t=findTr(e,c.kw,c.req,c.exc);
    if(t){used.add(t.nome);return filled(c.lb,c.lb,t);}
    return `<div class="gtile na"><span class="lock">${ico('cert',13)}</span><div class="gt"><div class="gi">${icoFor(c.lb,18)}</div><div class="gn">${c.lb}</div></div><div class="gd"><span class="dt na">não habilitado</span></div></div>`;}).join('');
  const outros=e.trainings.filter(t=>!used.has(t.nome));
  const outrosHtml=outros.length?'<div class="tr-sec" style="padding:12px 16px 2px">Outros treinamentos</div><div class="exec-grid">'+outros.map(t=>filled(t.nome,t.nome,t)).join('')+'</div>':'';
  return `
    <div class="cart-head">${brand(40)}<div class="ht"><b>UNILEVER</b><small>Carteirinha de Treinamentos</small></div><span class="chipw">Executor</span></div>
    <div class="secband"></div>
    <div class="portaria">Em conformidade com a Portaria 3.214 de 08/06/1978</div>
    <div class="front">
      <div class="foto"><div class="fi">${initials(e.nome)}</div><div class="flabel">FOTO</div></div>
      <div class="fdata"><div class="fname">${esc(e.nome)}</div><div class="fsub">${funcaoOf(e)} · Unilever</div>
        <div class="fmeta"><span>RE ${e.re}</span><span>${esc(e.area)}</span><span>${e.turno}</span></div></div>
    </div>
    <div class="idrow">
      <div class="idcell"><small>Renov. integração</small><b class="${igS}">${igS==='bad'?'Vencida':fmt(ig)}</b></div>
      <div class="idcell"><small>Renov. ASO</small><b class="${asoS}">${asoS==='bad'?'Vencido':fmt(aso)}</b></div>
    </div>
    <div class="status-strip ${sc}"><span class="dot"></span>${sl}</div>
    <div class="tr-sec" style="padding:12px 16px 2px">Validade dos treinamentos</div>
    <div class="exec-grid">${tiles}</div>
    ${outrosHtml}
    <div class="warnbar">${ico('flame',14)} Não opere equipamentos com habilitação vencida</div>
    <div class="sign-row">
      <div class="sign"><div class="sc" style="background:var(--ok)">${ico('shield',16)}</div><div><small>Visto SHE</small><b style="color:var(--ok)">Segurança ✓</b></div></div>
      <div class="sign"><div class="sc" style="background:var(--${asoS==='bad'?'bad':'ok'})">${ico('cert',16)}</div><div><small>Visto Saúde</small><b style="color:var(--${asoS==='bad'?'bad':'ok'})">${asoS==='bad'?'ASO vencido':'ASO válido'}</b></div></div>
    </div>`;
}
function libCard(e){

function kpiData(){let valid=0,warn=0,bad=0,total=0,empBad=0;

  return{valid,warn,bad,total,empBad,people:DATA.length};}
function viewDash(){
  const k=kpiData();const comp=Math.round(k.valid/k.total*100);
  const cards=[
    ['users',k.people.toLocaleString('pt-BR'),'Colaboradores','var(--uni)','var(--uni-l)',comp+'% conformidade','var(--ok-bg)','var(--ok)'],
    ['cert',k.valid.toLocaleString('pt-BR'),'Treinamentos válidos','var(--ok)','var(--ok-bg)','de '+k.total,'var(--bg)','var(--mut)'],
    ['alert',k.warn,'Vencendo em 30 dias','var(--warn)','var(--warn-bg)','requer ação','var(--warn-bg)','var(--warn)'],

  <div class="kpis">${cards.map(c=>`<div class="kpi"><div class="kic" style="background:${c[4]};color:${c[3]}">${ui(c[0],21)}</div><h3>${c[1]}</h3><small>${c[2]}</small><span class="trend" style="background:${c[6]};color:${c[7]}">${c[5]}</span></div>`).join('')}</div>
  <div class="grid2">

function barsByArea(){const m={};DATA.forEach(e=>{if(e.area==='—')return;m[e.area]=m[e.area]||{ok:0,t:0};e.trainings.forEach(t=>{m[e.area].t++;if(trStatus(t)==='ok')m[e.area].ok++;});});
  const arr=Object.entries(m).map(([a,v])=>[a,Math.round(v.ok/v.t*100),v.t]).sort((x,y)=>y[2]-x[2]).slice(0,7);
  return arr.map(([a,p])=>{const col=p>=90?'var(--ok)':p>=75?'var(--warn)':'var(--bad)';return `<div class="bar"><div class="lb">${a}</div><div class="track"><div class="fill" style="width:${p}%;background:${col}"></div></div><div class="vv" style="color:${col}">${p}%</div></div>`;}).join('');}
function barsByTrain(){const m={};DATA.forEach(e=>e.trainings.forEach(t=>m[t.nome]=(m[t.nome]||0)+1));
  const arr=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8);const max=arr[0][1];

    <div class="src"><div class="si" style="background:var(--uni-l);color:var(--uni)">${ui('audit',23)}</div><div style="flex:1"><b>SharePoint · Base de Treinamentos</b><p>Fonte principal. ~98% dos treinamentos legais e mandatórios.</p><span class="live"><span class="d"></span> Conectado · sync hoje 06:12</span></div></div>
    <div class="src"><div class="si" style="background:var(--ok-bg);color:var(--ok)">${ui('plug',23)}</div><div style="flex:1"><b>API UniU</b><p>Plataforma de treinamentos online. NR-6, NR-12 e NR-20.</p><span class="live"><span class="d"></span> Conectado · tempo real</span></div></div>
    <div class="src"><div class="si" style="background:var(--warn-bg);color:var(--warn)">${ui('cert',23)}</div><div style="flex:1"><b>SOC · Saúde Ocupacional (ASO)</b><p>Validade do exame ocupacional de cada colaborador.</p><span style="font-size:11.5px;font-weight:800;color:var(--warn)">◷ Integração pendente com o time de Saúde</span></div></div>
    <div class="src"><div class="si" style="background:var(--uni-l);color:var(--uni)">${ui('dash',23)}</div><div style="flex:1"><b>Power BI</b><p>Painéis de acompanhamento sobre a mesma base.</p><span class="live"><span class="d"></span> Ativo</span></div></div>
  </div>
  <div class="panel" style="margin-top:16px"><div class="pt"><b>Últimas sincronizações</b></div><div class="pb">
    ${[['SharePoint','hoje 06:12','1.460 registros','ok'],['API UniU','hoje 06:12','221 registros','ok'],['SOC','—','aguardando liberação','warn']].map(r=>`<div class="lrow"><div class="av" style="background:${r[3]==='ok'?'var(--ok)':'var(--warn)'}">${r[3]==='ok'?'✓':'!'}</div><div style="flex:1"><b>${r[0]}</b><small>${r[2]}</small></div><span class="tag">${r[1]}</span></div>`).join('')}
  </div></div>`;
}

function viewAudit(){
  const acts=[['emitiu carteirinha de','idcard','var(--uni)'],['aprovou treinamento de','cap','var(--ok)'],['sincronizou base de','plug','var(--uni)'],['sinalizou vencimento de','alert','var(--warn)']];
  const rows=DATA.slice(0,14).map((e,i)=>{const a=acts[i%acts.length];const h=(6+i)%24;return {e,a,when:`27/08 ${String(9+ (i%9)).padStart(2,'0')}:${String((i*7)%60).padStart(2,'0')}`};});
  return `<div class="ph"><div><h1>Auditoria</h1><p>Registro de ações no sistema. Imutável.</p></div>
    <div class="sp"><button class="btn" onclick="alertMock('exportar log')">${ui('download',16)} Exportar log</button></div></div>
  <div class="tbl-wrap"><div class="tbl-scroll"><table><thead><tr><th>Quando</th><th>Usuário</th><th>Ação</th><th>Alvo</th></tr></thead>
    <tbody>${rows.map(r=>`<tr style="cursor:default"><td style="color:var(--mut)">${r.when}</td><td><div class="cell-nm"><div class="av" style="width:28px;height:28px;background:var(--uni)">AG</div>Ana Gomes</div></td>
      <td><span class="st" style="color:${r.a[2]}"><span class="d" style="background:${r.a[2]}"></span>${r.a[0]}</span></td><td><b>${esc(r.e.nome)}</b> <small style="color:var(--mut)">RE ${r.e.re}</small></td></tr>`).join('')}</tbody></table></div>
    <div class="tfoot"><span>Mostrando atividade recente</span><span>Retenção: 5 anos</span></div></div>`;
}

function viewConfig(){
  return `<div class="ph"><div><h1>Configurações</h1><p>Perfis de acesso e regras da carteirinha.</p></div></div>
  <div class="panel"><div class="pt"><b>Perfis de acesso</b></div><div class="pb">
    <div class="lrow"><div class="av" style="background:var(--uni)">AG</div><div style="flex:1"><b>Administrador</b><small>Gerencia treinamentos, colaboradores e integrações.</small></div><span class="tag">1 usuário</span></div>
    <div class="lrow"><div class="av" style="background:var(--ok)">SG</div><div style="flex:1"><b>Segurança do Trabalho (SHE)</b><small>Emite e valida carteirinhas, consulta na área.</small></div><span class="tag">8 usuários</span></div>
    <div class="lrow"><div class="av" style="background:var(--warn)">SA</div><div style="flex:1"><b>Saúde Ocupacional</b><small>Gerencia validade de ASO.</small></div><span class="tag">3 usuários</span></div>
    <div class="lrow"><div class="av" style="background:var(--mut)">CO</div><div style="flex:1"><b>Colaborador</b><small>Consulta a própria carteirinha por RE / QR (sem login).</small></div><span class="tag">${DATA.length} pessoas</span></div>
  </div></div>
  <div class="panel" style="margin-top:16px"><div class="pt"><b>Regra de vencimento</b></div><div class="pb" style="color:var(--mut);font-size:13.5px;line-height:1.8">
    Aviso de <b style="color:var(--warn)">vencimento próximo</b> disparado <b style="color:var(--ink)">30 dias</b> antes.<br>
    Data de vencimento = <b style="color:var(--ink)">Data de realização + Validade (dias)</b>.<br>
    Colaborador com qualquer treinamento vencido fica <b style="color:var(--bad)">Inapto</b> para a atividade correspondente.
  </div></div>`;
}

/* ---- notif / modal ---- */
function toggleNotif(){const n=document.getElementById('notif');const open=n.classList.contains('on');
  if(open){n.classList.remove('on');return;}
  const rows=[];DATA.forEach(e=>e.trainings.forEach(t=>{const d=daysTo(t.vencimento);if(d!==null&&d<=30)rows.push({e,t,d});}));
  rows.sort((a,b)=>a.d-b.d);
  n.innerHTML=`<div class="pt" style="padding:14px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center"><b style="font-size:15px">Vencimentos</b><button class="btn sm" style="margin-left:auto" onclick="route('alertas');toggleNotif()">Ver todos</button></div>
    <div style="max-height:360px;overflow:auto;padding:6px 14px">${rows.slice(0,8).map(r=>`<div class="lrow" onclick="route('colab','${r.e.re}');toggleNotif()"><div class="av" style="background:${r.d<0?'var(--bad)':'var(--warn)'}">${r.d<0?'!':r.d}</div><div style="flex:1"><b>${esc(r.e.nome)}</b><small>${esc(r.t.nome)} · ${r.d<0?'vencido':'vence em '+r.d+'d'}</small></div></div>`).join('')}</div>`;
  n.classList.add('on');}
function alertMock(x){const m=document.getElementById('modal');m.innerHTML=`<div class="mh">${ui('idcard',20)}<b>Ação do sistema</b><button class="x" onclick="closeAll()">${ui('x',16)}</button></div>
  <div class="mb"><p style="font-size:14px;line-height:1.6;color:var(--mut)">No sistema em produção, esta ação executa: <b style="color:var(--ink)">${x}</b>.</p>
  <p style="font-size:13px;color:var(--mut2);margin-top:12px">Este é um protótipo navegável com dados de amostra.</p>
  <button class="btn pri" style="margin-top:18px;width:100%;justify-content:center" onclick="closeAll()">Entendi</button></div>`;
  document.getElementById('scrim').classList.add('on');m.classList.add('on');}
function closeAll(){document.getElementById('scrim').classList.remove('on');document.getElementById('modal').classList.remove('on');document.getElementById('notif').classList.remove('on');}

/* ================= MOUNT ================= */
function renderScreen(){
  const r=root();
  if(state.screen==='login')r.innerHTML=loginView();
  else if(state.screen==='consult'){r.innerHTML=consultView();renderConsultBody();}
  else {r.innerHTML=appShell();renderRoute();}
  drawQRs();window.scrollTo(0,0);
}
renderScreen();
</script>
